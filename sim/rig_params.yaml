# Where each subsystem is bolted onto the SLATE, for the combined model.
#
# Consumed by tools/build_rig_urdf.py, which writes sim/description/urdf/rig.urdf.
# Edit here and re-run `make rig-urdf`; never hand-edit the generated URDF.
#
# xyz in metres, rpy in radians, both relative to the rig's base_link
# (REP-103: +x forward, +y left, +z up, origin at the drive-axle midpoint at
# ground level).
#
# CONFIDENCE IS NOT UNIFORM AND IS MARKED PER ENTRY. The arm ROTATIONS are
# derived from the ARM_WORLD_* command remap, which was tuned against the real
# arms until +x/+y/+z moved them the way the operator expected -- so they are
# confirmed by the hardware. The POSITIONS are not: they come either from
# Trossen's stock URDF or from a STEP extraction that is known to disagree with
# itself. Treat every "estimate" below as a number to correct, not to trust.

arms:
  # Rotation: CONFIRMED. +90 deg about y, so the arm's own +z (its waist axis)
  # points along world +x -- the arm points forward. This is exactly the inverse
  # of ARM_WORLD_X=+z / ARM_WORLD_Y=+y / ARM_WORLD_Z=-x in
  # manip-arm/docker-compose.yml, and the two must stay in step: if the command
  # remap is retuned, this rotation is wrong until it is retuned too.
  #
  # Position: MEASURED 2026-09-29 (tape, lift fully down). Base plate centres
  # 21 cm either side of the middle arm along y, 55 cm above the floor. x is
  # the mast bar's; the bar sits over the SLATE's centre and all three arms
  # share it, so the arms' RELATIVE geometry -- what the collision gate needs
  # -- is exact and their common fore/aft offset from the drive axle is not
  # (a few cm; it only moves the whole group in the 3D view).
  #
  # ALL THREE ARMS RIDE THE LIFT (they hang off the mast bar, which is bolted
  # to the lift platform), so their parent is lift_platform and these xyz are
  # at lift height 0. The collision gate applies the lift height to every arm
  # with this parent; the 3D view currently draws the WXAI arms on base_link.
  left:
    parent: lift_platform
    xyz: [0.0, 0.210, 0.550]
    rpy: [0.0, 1.5707963, 0.0]
  right:
    parent: lift_platform
    xyz: [0.0, -0.210, 0.550]
    rpy: [0.0, 1.5707963, 0.0]

# The lift's own origin is the floor under the SLATE's centre, height measured
# from there: with `lift.xyz` at z = 0 every arm's z above is a plain "above the
# floor" number, which is what a tape measure gives.
lift:
  xyz: [0.0, 0.0, 0.0]
  rpy: [0.0, 0.0, 0.0]
  # Travel of the prismatic joint, metres. The driver reports height on
  # /slate/lift/height; this is the range that reading is drawn over.
  travel: [0.0, 0.40]

# MEASURED 2026-09-29: base plate centred on the SLATE, its underside 59 cm
# above the floor with the lift fully down. Upright (rpy 0).
middle:
  parent: lift_platform
  xyz: [0.0, 0.0, 0.590]
  rpy: [0.0, 0.0, 0.0]
