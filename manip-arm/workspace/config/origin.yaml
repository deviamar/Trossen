# Where (0, 0, 0) is, per arm, in WORLD axes (after the
# ARM_WORLD_* mount remap). Captured at first start and kept
# across restarts so a fault does not move the coordinate
# system. Re-capture with the zero keys (4/5/6) in rig_key.py,
# or delete a key here to re-zero on next start.
left_arm:
  note: first start
  offset:
  - -0.391274
  - 0.003828
  - 0.168007
right_arm:
  note: first start
  offset:
  - -0.392558
  - 0.005035
  - 0.170096
