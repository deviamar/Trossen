# =============================================================================
# The two WXAI manipulator arms, one container each.
#
# Both services share one image and differ only in container_name and ARM_IP.
# The host NIC must already be up on 192.168.1.1/24 (see README.md).
#
# Every WXAI ships on 192.168.1.2. Two arms on one switch with the same address
# does not fail cleanly: the driver connects to whichever answers first, so one
# arm moves on both containers' commands. Re-address one arm before plugging
# both in (README.md, "Two arms on one switch").
# =============================================================================

# `x-` blocks are Compose extension anchors: merged into the services below,
# never started as containers themselves.
x-arm-common: &arm-common
  build:
    context: .
    dockerfile: Dockerfile
    network: host
    args:
      USER_UID: ${UID:-1000}
      USER_GID: ${GID:-1000}
  image: trossen-arm:latest

  # Needed for raw access to the arm subnet and for DDS multicast, so these
  # containers, middle-arm and any host-side ROS node share one graph.
  network_mode: host

  # Share /dev/shm with the host. Fast DDS discovers over UDP but moves data
  # over shared memory, so without this every topic is listed and no message
  # ever arrives.
  ipc: host

  # Come back after a crash or reboot. start.sh pings the arm before connecting,
  # so a restart with the link down idles instead of hot-looping.
  restart: unless-stopped

  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - ./workspace:/home/robot/workspace
    # The inter-arm collision gate and its capsules.yaml, read-only. Shared so
    # every arm checks the same model (generated by tools/fit_capsules.py).
    - ../rig:/home/robot/rig:ro

  # RViz2 works on software GL. Enable this block only on a host with the
  # NVIDIA container runtime, and add NVIDIA_DRIVER_CAPABILITIES=all to
  # `environment` when you do.
  # deploy:
  #   resources:
  #     reservations:
  #       devices:
  #         - driver: nvidia
  #           count: all
  #           capabilities: [gpu]


  # Autostart the agent via start.sh; AUTOSTART=false gives a bare shell for
  # the CLIs instead. `bash -lc` sources ROS, and `$$` is Compose's escape for
  # a literal `$`.
  command: ["bash", "-lc", "if [ \"$${AUTOSTART:-true}\" = true ]; then exec ./start.sh; else exec bash; fi"]

  stdin_open: true
  tty: true

# Mapping form, not a `- KEY=value` list, so the YAML merge key below can
# extend it per service.
x-arm-env: &arm-env
  # true runs arm_agent.py, which holds the arm's only connection, so pose.py,
  # read_joints.py and teach.py cannot run beside it. false gives a bare shell.
  AUTOSTART: "true"
  # Mount frame. The arms are bolted to the lift's vertical face, so each line
  # says which arm axis a world axis maps onto ("world +x moves the arm along
  # its +z"). Everything outside the container speaks the world frame.
  ARM_WORLD_X: "+z"
  ARM_WORLD_Y: "+y"
  ARM_WORLD_Z: "-x"

  # Report the end effector relative to where it was at connect, so it starts
  # at (0, 0, 0). false reports raw arm coordinates.
  ARM_ZERO_ON_START: "true"

  # How a streamed cmd_pose becomes motion. joint_ik is our own IK (arm_kin.py)
  # and works with the elbow folded back, where rest lives; velocity and
  # position use the controller's Cartesian IK and only work on the positive
  # elbow branch. `restart` does not reload this; use `docker compose up -d`.
  ARM_STREAM_MODE: "joint_ik"
  ARM_MAX_LIN_VEL: "0.15"        # m/s cap on the end effector
  ARM_MAX_ANG_VEL: "1.2"        # rad/s cap
  ARM_VEL_KP: "3.5"             # error -> velocity gain, 1/s; ~1/Kp settle time
  # How far a target may lead the arm. Releasing a key stops the arm within
  # this distance, and top speed is KP x LEAD, so keep KP x LEAD_M >= MAX_LIN_VEL.
  ARM_MAX_LEAD_M: "0.07"
  ARM_MAX_LEAD_RAD: "0.4"
  # Acceleration caps on the commanded velocity (m/s^2, rad/s^2). A stepped
  # target becomes a ramp instead of a torque step. Lower is smoother but laggier.
  ARM_MAX_LIN_ACC: "1.0"
  ARM_MAX_ANG_ACC: "4.0"
  # No mode writes during a session: gripper openings become forces, and
  # enable=false holds in position mode instead of idling. Each mode write
  # drops the control loop for an instant, which is the sag-and-catch twitch.
  ARM_GRIPPER_POSITION_MODE: "false"
  ARM_IDLE_ON_DISABLE: "false"
  # Inter-arm collision gate (rig/rig_collision.py); "0" disables it. Arm
  # mounts were tape-measured 2026-09-29, the ZED mount is not yet. Check with
  # `python3 rig/rig_collision.py` (offline) or `make clearance` (live).
  RIG_GATE: "1"
  RIG_GATE_MARGIN: "0.03"       # metres, structural pairs; camera/fingers differ

  ARM_MODEL: wxai_v0            # set to whatever your actual arm model string is
  # End effector variant: base (bare flange), leader (handle) or follower
  # (gripper). It feeds the gravity and friction model, so `base` on an arm
  # with a gripper makes force commands weak and uneven. Use base only if the
  # gripper is physically removed.
  ARM_EE: wxai_v0_follower
  # Not 0, the ROS default, or a stray rig on the lab wifi joins this graph.
  # Must match ../middle-arm/docker-compose.yml.
  ROS_DOMAIN_ID: "42"
  # Pinned: a DDS mismatch between containers is a silent no-discovery failure.
  # Must match ../middle-arm/docker-compose.yml.
  RMW_IMPLEMENTATION: rmw_fastrtps_cpp
  DISPLAY: "${DISPLAY:-:0}"
  QT_X11_NO_MITSHM: "1"         # avoids a common Qt/RViz X11 shared-memory glitch in containers

services:
  left-arm:
    <<: *arm-common
    container_name: left-arm
    environment:
      <<: *arm-env
      ARM_IP: "${LEFT_ARM_IP:-192.168.1.2}"
      # ARM_NAME keys this arm's poses in workspace/config/poses.yaml; ARM_NS is
      # the ROS namespace it owns. Separate so renaming a pose key never
      # re-targets teleop.
      ARM_NAME: left_arm
      ARM_NS: /left_arm

  right-arm:
    <<: *arm-common
    container_name: right-arm
    environment:
      <<: *arm-env
      # The re-addressed arm: set_manual_ip("192.168.1.3") was written to its
      # controller.
      ARM_IP: "${RIGHT_ARM_IP:-192.168.1.3}"
      ARM_NAME: right_arm
      ARM_NS: /right_arm
