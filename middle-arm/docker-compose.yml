# =============================================================================
# Middle arm -- ARM-ONLY variant (default).
#
# ubuntu:22.04 base, no ZED, no CUDA, no GPU required. Bring this up first: it
# proves the DYNAMIXEL chain (U2D2 -> /dev/ttyDXL -> servos) works without
# dragging in the CUDA/ZED stack, and it builds in ~20-30 min instead of ~45
# with a ~15 GB pull.
#
# For the camera, layer the override on top -- it flips BASE_IMAGE + WITH_ZED
# and adds the GPU reservation:
#
#   docker compose -f docker-compose.yml -f docker-compose.zed.yml build
#
# The GPU reservation lives ONLY in that override, deliberately: it needs
# nvidia-container-toolkit on the host, and if it sat here the default build
# would fail on any machine without it with
#   could not select device driver "nvidia" with capabilities: [[gpu]]
# =============================================================================
services:
  middle-arm:
    build:
      # Repo root, not this directory: the build needs third_party/pyroki, and
      # a build context cannot reach outside itself. Every COPY in the
      # Dockerfile is therefore written relative to the root -- note the
      # middle-arm/ prefixes. Nothing else about running this project changes;
      # `cd middle-arm && docker compose up -d` still works.
      context: ..
      dockerfile: middle-arm/Dockerfile
      network: host
      args:
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
        # Passed explicitly rather than leaning on the Dockerfile defaults, so
        # that reading this file tells you which variant you get.
        BASE_IMAGE: ubuntu:22.04
        WITH_ZED: "false"
        WITH_MOVEIT: "false"       # "true" also builds interbotix_xsarm_moveit
    image: middle-arm:latest
    container_name: middle-arm

    # Same host networking + ROS_DOMAIN_ID as the wxai_v0 container, so all
    # containers share one DDS graph and `ros2 topic list` sees every arm.
    network_mode: host

    # Share the host IPC namespace, which means sharing /dev/shm.
    #
    # NOT optional, and the failure it prevents is genuinely misleading: Fast DDS
    # discovers peers over UDP -- which works, because network_mode: host gives
    # every container one network stack -- but then negotiates SHARED MEMORY for
    # the actual data on the same host. Each container gets its own private 64 MB
    # /dev/shm by default, so the segments never match. The result is `ros2 topic
    # list` showing everything, `ros2 topic info --verbose` showing a healthy
    # publisher, and not one message ever arriving.
    #
    # slate-base appeared to work without this only because it mounts /dev:/dev
    # for the serial port, which drags the host's /dev/shm in by accident. Set
    # explicitly here so it is a decision rather than a side effect.
    ipc: host

    # For the arm alone this is heavier than strictly necessary -- the tighter
    # form is `devices: [/dev/ttyDXL]` plus `device_cgroup_rules: ["c 188:* rmw"]`
    # (188 is ttyUSB; the U2D2 is an FTDI part, so it enumerates there, not 189).
    # Kept as-is because a `devices:` entry makes `up` fail outright whenever the
    # U2D2 is unplugged, and because the ZED override needs privileged anyway:
    # the SDK enumerates the camera over raw USB and the device re-enumerates at
    # a new bus address on every camera reset, so a static device list goes stale
    # the first time the camera hiccups.
    privileged: true

    environment:
      # true: start this container's nodes automatically (see start.sh)
      # false: bare shell, for the CLIs that need the hardware to themselves
      - AUTOSTART=true
      - ROBOT_MODEL=wx250s
      - ROBOT_NAME=middle           # ROS namespace; matches AV-ALOHA's "middle" arm
      - DXL_PORT=/dev/ttyDXL        # created by the host udev rule, see host-setup/
      # Deliberately NOT 0. Zero is the ROS 2 default, so every ROS 2 machine on
      # the same network joins that graph -- on the lab wifi this host picked up
      # a separate glove/IMU teleop rig (/glove/*, /wrist_imu/*, /right_hand)
      # running on another computer. Harmless in itself, but it shares /tf and
      # leaves /middle/commands/* reachable from the whole subnet. Must match
      # ../manip-arm/docker-compose.yml or the two stop discovering each other.
      - ROS_DOMAIN_ID=42
      # Pinned explicitly rather than left to the default: a DDS mismatch between
      # containers produces a silent no-discovery failure that looks like a
      # network problem. The same value is set in ../manip-arm/docker-compose.yml.
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1

    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./workspace:/home/robot/workspace


    # Autostart: after `docker compose up -d` this container's topics are live
    # with nothing left to run by hand. `bash -lc` so the ROS environment is
    # sourced -- `command:` bypasses the entrypoint exactly as `exec` does.
    #
    # AUTOSTART=false drops to a bare shell instead. Use that when you want the
    # CLIs, which cannot share the hardware with the agent. The $$ is Compose's
    # escape for a literal $, so bash expands it inside the container -- without
    # it Compose would substitute at parse time from the HOST environment and the
    # variable below would do nothing.
    command: ["bash", "-lc", "if [ \"$${AUTOSTART:-true}\" = true ]; then exec ./start.sh; else exec bash; fi"]

    stdin_open: true
    tty: true
