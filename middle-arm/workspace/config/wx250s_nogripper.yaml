# wx250s with the gripper removed -- this arm's DYNAMIXEL ID 9 was physically
# taken off and a camera mounted in its place (active-vision head).
#
# Derived from the stock interbotix_xsarm_control config/wx250s.yaml. Kept as a
# copy in the bind-mounted workspace rather than as an edit to the vendor file in
# /opt, so an image rebuild cannot silently revert it.
#
# Diff vs. stock wx250s.yaml, in full:
#   1. `gripper` dropped from joint_order         (7 joints -> 6)
#   2. sleep_positions trimmed to match           (7 values -> 6)
#   3. the entire `grippers:` block removed
#   4. the `gripper:` motor entry (ID 9) removed
# Motors 1-8 and the shadow/calibration setup are untouched.
#
# The symptom of NOT doing this is the launch failing on a missing 9th motor:
# xs_sdk pings every ID listed under `motors:` at startup and aborts when one
# does not answer.
port: /dev/ttyDXL

joint_order: [waist, shoulder, elbow, forearm_roll, wrist_angle, wrist_rotate, camera_yaw]
sleep_positions: [0, -1.85, 1.55, 0, 0.3, 0, 0]

joint_state_publisher:
  update_rate: 100
  publish_states: true
  topic_name: joint_states

groups:
  arm: [waist, shoulder, elbow, forearm_roll, wrist_angle, wrist_rotate, camera_yaw]

# No `grippers:` block -- there is no gripper on this arm.

shadows:
  shoulder:
    shadow_list: [shoulder_shadow]
    calibrate: true
  elbow:
    shadow_list: [elbow_shadow]
    calibrate: true

sisters:

motors:
  waist:
    ID: 1
    Baud_Rate: 3
    Return_Delay_Time: 0
    Drive_Mode: 0
    Velocity_Limit: 131
    Min_Position_Limit: 0
    Max_Position_Limit: 4095
    Secondary_ID: 255

  shoulder:
    ID: 2
    Baud_Rate: 3
    Return_Delay_Time: 0
    Drive_Mode: 0
    Velocity_Limit: 131
    Min_Position_Limit: 819
    Max_Position_Limit: 3345
    Secondary_ID: 255

  shoulder_shadow:
    ID: 3
    Baud_Rate: 3
    Return_Delay_Time: 0
    Drive_Mode: 1
    Velocity_Limit: 131
    Min_Position_Limit: 819
    Max_Position_Limit: 3345
    Secondary_ID: 2

  elbow:
    ID: 4
    Baud_Rate: 3
    Return_Delay_Time: 0
    Drive_Mode: 0
    Velocity_Limit: 131
    Min_Position_Limit: 648
    Max_Position_Limit: 3094
    Secondary_ID: 255

  elbow_shadow:
    ID: 5
    Baud_Rate: 3
    Return_Delay_Time: 0
    Drive_Mode: 1
    Velocity_Limit: 131
    Min_Position_Limit: 648
    Max_Position_Limit: 3094
    Secondary_ID: 4

  forearm_roll:
    ID: 6
    Baud_Rate: 3
    Return_Delay_Time: 0
    Drive_Mode: 0
    Velocity_Limit: 131
    Min_Position_Limit: 0
    Max_Position_Limit: 4095
    Secondary_ID: 255

  wrist_angle:
    ID: 7
    Baud_Rate: 3
    Return_Delay_Time: 0
    Drive_Mode: 1
    Velocity_Limit: 131
    Min_Position_Limit: 910
    Max_Position_Limit: 3447
    Secondary_ID: 255

  wrist_rotate:
    ID: 8
    Baud_Rate: 3
    Return_Delay_Time: 0
    Drive_Mode: 0
    Velocity_Limit: 131
    Min_Position_Limit: 0
    Max_Position_Limit: 4095
    Secondary_ID: 255

  # THE CAMERA'S YAW MOTOR. This arm has SEVEN joints: the slot the vendor
  # uses for a gripper carries a second camera motor, exactly as giava's
  # wx250s_7dof config has it. It was missing from this file, so the driver
  # never enumerated it and nothing could command it -- which is why turning
  # your head barely turned the camera: only camera_roll (ID 8) moved.
  #
  # It shipped at ID 1 / 57600 baud (factory defaults) and was invisible to a
  # driver scanning at 1 Mbps. tools/setid.py wrote ID 9 and 1 Mbps into its
  # EEPROM; run that again with --undo to put it back.
  camera_yaw:
    ID: 9
    Baud_Rate: 3
    Return_Delay_Time: 0
    Drive_Mode: 0
    Velocity_Limit: 131
    Min_Position_Limit: 0
    Max_Position_Limit: 4095
    Secondary_ID: 255
