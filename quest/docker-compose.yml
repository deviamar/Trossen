# =============================================================================
# Meta Quest teleop source.
#
# The only container that publishes into other components' namespaces, and the
# only one with no hardware of its own beyond a network socket. No devices, no
# privileges, no /dev mount -- if this container is compromised or simply wrong,
# the worst it can do is publish bad ROS messages, and the governor and arm
# agent are built on the assumption that it might.
#
# network_mode: host for two reasons here, not one. DDS, as everywhere else --
# and the headset sends UDP to this machine's LAN address, which bridge
# networking would put behind a NAT.
# =============================================================================
services:
  quest:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
    image: quest-teleop:latest
    container_name: quest
    network_mode: host

    # Share the host IPC namespace, which means sharing /dev/shm.
    #
    # NOT optional, and the failure it prevents is genuinely misleading: Fast DDS
    # discovers peers over UDP -- which works, because network_mode: host gives
    # every container one network stack -- but then negotiates SHARED MEMORY for
    # the actual data on the same host. Each container gets its own private 64 MB
    # /dev/shm by default, so the segments never match. The result is `ros2 topic
    # list` showing everything, `ros2 topic info --verbose` showing a healthy
    # publisher, and not one message ever arriving.
    #
    # slate-base appeared to work without this only because it mounts /dev:/dev
    # for the serial port, which drags the host's /dev/shm in by accident. Set
    # explicitly here so it is a decision rather than a side effect.
    ipc: host

    environment:
      # true: start this container's nodes automatically (see start.sh)
      # false: bare shell, for the CLIs that need the hardware to themselves
      # false ON PURPOSE, unlike every other container.
      #
      # This one is a teleop SOURCE. Its node publishes to /left_arm/cmd_*,
      # /right_arm/cmd_*, /middle/cmd_* and /slate/cmd_vel_teleop at 72 Hz --
      # including a dead-man zero when nothing is pressed, and including on the
      # `sim` backend where the input is a fake circle. The newest message on a
      # command topic wins, so an autostarted quest silently overrides
      # arm_key.py, arm_ctl.py and drive_test.py and makes them all look dead.
      #
      # The container still comes up with `make`, so it is there when you want
      # it. Start teleop explicitly:
      #     docker compose exec quest ./launch-quest.sh --backend webrtc
      - AUTOSTART=false
      - QUEST_NS=/quest
      # Which namespace each hand drives. Changing these re-targets teleop
      # without touching a line of code -- point them at a second pair of arms,
      # or swap left and right if the rig is mirrored.
      - QUEST_ARM_NS_LEFT=/left_arm
      - QUEST_ARM_NS_RIGHT=/right_arm
      - QUEST_BASE_NS=/slate
      # Operator comfort limits. The real safety limit is CLAMP_VEL_* in
      # slate-base, enforced by the governor, in the container that owns the
      # serial port -- deliberately somewhere this file cannot raise it.
      - QUEST_BASE_MAX_X=0.25
      - QUEST_BASE_MAX_Z=0.6
      # Left stick drives AND turns (fwd/back + left/right); the right stick's
      # fwd/back is the scissor lift's z velocity -- simulated until the lift
      # hardware is wired, same topic either way. -1 makes stick-left turn
      # left under the contract's "stick X right-positive" convention; set +1
      # if your app reports the axis the other way round.
      - QUEST_TURN_SIGN=-1
      - QUEST_LIFT_MAX_VEL=0.05
      # Hand motion -> EE motion. giava ran 1.35; 1:1 until dialled in by feel.
      - QUEST_POS_SCALE=1.0
      # The camera arm, scaled separately and lower -- you are looking through
      # it, so amplified head motion reads as the world swimming. 0.6 was
      # giava's; this rig needed a little more to feel responsive.
      - QUEST_CAM_POS_SCALE=0.68
      # How the operator stands relative to the rig, degrees of yaw: 0 facing
      # the same way as rig +x, 180 facing it head-on. The SESSION yaw (the
      # app world's arbitrary heading) is measured from your gaze at engage,
      # so it does not belong here.
      - QUEST_ARM_REMAP_YAW_DEG=0
      - QUEST_CAM_REMAP_YAW_DEG=0
      # Trigger -> closing force, newtons (the arm agent hard-caps at 100 N).
      - QUEST_GRASP_MIN_N=5
      - QUEST_GRASP_MAX_N=40
      # B on the right controller: park every arm at 'rest', then end the
      # session. false leaves teleop running after parking. The wait is how
      # long the link stays up so the agents can finish the move.
      - QUEST_REST_BUTTON=right
      - QUEST_REST_QUITS=true
      - QUEST_REST_QUIT_WAIT=12
      - QUEST_MIDDLE_NS=/middle
      - QUEST_SECRETS_DIR=/secrets
      # Where the bind mount above lands. gvlink_headset.py puts this on
      # sys.path before importing the protocol.
      - GVLINK_PATH=/opt/gvlink
      # Name shown in the headset's robot picker / broadcast in the beacon.
      - GIAVA_ROBOT_NAME=trossen
      # gvlink needs no secrets and no cloud: the headset finds this process by
      # LAN beacon on 15550 and opens TCP 15551. network_mode: host already
      # gives it the host's interfaces, so nothing here has to be published.
      # The stereo pair pushed back to the headset, from the middle arm's ZED.
      # Whatever resolution the ZED publishes is resized to STEREO_WIDTH x
      # STEREO_HEIGHT before it goes down the wire, so the camera can stay
      # configured for the rest of the rig.
      # zed_wrapper publishes under <camera_name>/<node_name>/, and the middle
      # arm launches it with camera_name:=middle_cam. Confirm with
      # `ros2 topic list | grep image_rect` before trusting these.
      - QUEST_STEREO_LEFT=/middle_cam/zed_node/left/image_rect_color
      - QUEST_STEREO_RIGHT=/middle_cam/zed_node/right/image_rect_color
      - QUEST_STEREO_WIDTH=640
      - QUEST_STEREO_HEIGHT=480
      # A local SBS stereo camera (empty = use the ROS topics above instead).
      # Uncalibrated, so the viewer is given synthesised geometry -- measure
      # these two if the stereo does not sit comfortably.
      - QUEST_CAMERA=/dev/video4
      - QUEST_CAM_HFOV_DEG=70
      - QUEST_CAM_BASELINE_M=0.06
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp

    # A side-by-side USB stereo camera, when one is plugged in. group_add gives
    # the container user the host's `video` group so /dev/video* is readable
    # without running privileged. The ZED on the middle arm does NOT come
    # through here -- it is that container's device and arrives as ROS topics.
    devices:
      - /dev/video4:/dev/video4
    group_add:
      - video

    volumes:
      - ./workspace:/home/robot/workspace
      # THE gvlink PROTOCOL LIBRARY, from the Unity repo. Bind-mounted rather
      # than vendored on purpose: the Python sender and the C# viewer have to
      # agree byte for byte, so there is exactly one copy of it and it lives
      # beside the C#. Clone av-aloha-unity (branch v2) into ~/av-aloha-unity
      # -- a missing checkout surfaces as an ImportError from the gvlink
      # backend and nothing else breaks.
      - ${GVLINK_SRC:-${HOME}/av-aloha-unity/Guided-Vision/python}:/opt/gvlink:ro
      # WebRTC signalling secrets: a Firestore service account and the
      # robotID/password/TURN settings. Read-only, and mounted rather than
      # baked in -- they are credentials, and an image gets pushed around.
      # Both are gitignored here exactly as they are upstream in giava.
      - ./secrets:/secrets:ro


    # Autostart: after `docker compose up -d` this container's topics are live
    # with nothing left to run by hand. `bash -lc` so the ROS environment is
    # sourced -- `command:` bypasses the entrypoint exactly as `exec` does.
    #
    # AUTOSTART=false drops to a bare shell instead. Use that when you want the
    # CLIs, which cannot share the hardware with the agent. The $$ is Compose's
    # escape for a literal $, so bash expands it inside the container -- without
    # it Compose would substitute at parse time from the HOST environment and the
    # variable below would do nothing.
    command: ["bash", "-lc", "if [ \"$${AUTOSTART:-true}\" = true ]; then exec ./start.sh; else exec bash; fi"]

    stdin_open: true
    tty: true
